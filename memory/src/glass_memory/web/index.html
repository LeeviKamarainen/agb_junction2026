<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory map</title>
  <link rel="icon" href="data:,"><!-- no icon, so the browser doesn't ask the server for one -->
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 1400px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p { margin: 4px 0 12px; }
    select, input, button { font: inherit; padding: 6px 8px; max-width: 100%; }
    #summary, #answer { white-space: pre-wrap; }
    #status { min-height: 1.4em; font-weight: 600; }
    form { display: flex; gap: 8px; margin: 12px 0; }
    #question { flex: 1; min-width: 0; }
    #retrieved { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    #retrieved img { height: 72px; border-radius: 6px; cursor: pointer; }
    main { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    figure { margin: 0; }
    figcaption { margin-top: 6px; font-size: 0.9rem; opacity: 0.8; }
    /* pan-y: a vertical swipe scrolls the page, a sideways drag moves over the points. */
    canvas {
      display: block; width: 100%; height: 50vh; min-height: 260px;
      background: #1a1a19; border-radius: 8px; cursor: crosshair; touch-action: pan-y;
    }
    #legend { display: flex; gap: 8px; align-items: center; }
    #ramp { width: 160px; height: 8px; border-radius: 4px; }
    #still { display: block; max-width: 100%; max-height: 50vh; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Memory map</h1>
  <p>One point per memory of a batch: similar stills sit close together, and the colour is the
    time. Point at a memory, or tap it, to see its still. A question rings the memories it
    retrieved, and Gemma answers from their stills.</p>
  <label>Batch <select id="batch"></select></label>
  <p id="summary"></p>
  <form id="ask">
    <input id="question" aria-label="Question" placeholder="Ask about this batch" required autocomplete="off">
    <button id="send">Ask</button>
  </form>
  <p id="status" role="status"></p>
  <p id="answer"></p>
  <div id="retrieved"></div>
  <main>
    <figure>
      <canvas id="map"></canvas>
      <figcaption id="legend"><span id="start"></span><span id="ramp"></span><span id="end"></span></figcaption>
    </figure>
    <figure>
      <img id="still" alt="">
      <figcaption id="caption"></figcaption>
    </figure>
  </main>
  <script>
    "use strict";
    const $ = (id) => document.getElementById(id);
    const canvas = $("map"), statusLine = $("status");
    const TOKEN_KEY = "glass-memory-token";
    const SURFACE = "#1a1a19"; // the canvas background, also the gap drawn around each point
    // One hue from dark to light: early memories are dark, late ones light.
    const RAMP = ["#184f95", "#256abf", "#3987e5", "#6da7ec", "#9ec5f4", "#cde2fb"]
      .map((hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16)));
    const RADIUS = 5;       // of a point, in CSS pixels
    const REACH = 40;       // how far from a point the pointer may be and still choose it
    const MAX_STILLS = 200; // blob URLs kept; a still is about 100 KB

    let token = readToken();
    let batches = [];          // GET /batches
    let points = [];           // the chosen batch's map; draw() adds px, py and color
    let chosen = null;         // the point whose still is shown
    let retrieved = new Set(); // keyframe names the last question retrieved
    const stills = new Map();  // keyframe name -> promise of a blob URL, least recently used first

    // The token comes in the shared link (#token=...), which never reaches the server or its
    // logs, and is remembered in this browser. Without storage it lasts until the page closes.
    function remember(value) { try { localStorage.setItem(TOKEN_KEY, value); } catch {} }
    function recall() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } }
    function forget() { try { localStorage.removeItem(TOKEN_KEY); } catch {} }

    function readToken() {
      const fromLink = /(?:^#|&)token=([^&]*)/.exec(location.hash)?.[1];
      if (!fromLink) return recall();
      history.replaceState(null, "", location.pathname); // out of the address bar
      remember(fromLink);
      return fromLink;
    }

    // Every request carries the token in the Authorization header, never in the address.
    async function api(path, options = {}) {
      if (!token) throw new Error("This page needs its token: open the link you were sent (it ends in #token=…).");
      const response = await fetch(path, {
        ...options, headers: { ...options.headers, Authorization: `Bearer ${token}` },
      }).catch((error) => { throw new Error(`Could not reach the server: ${error.message}`); });
      if (response.status === 401) {
        forget();
        token = null;
        throw new Error("The token was refused. Open the link you were sent again.");
      }
      if (!response.ok) {
        const body = await response.json().catch(() => null); // a proxy error page is not JSON
        const detail = typeof body?.detail === "string" ? body.detail : response.statusText;
        throw new Error(`No result (${response.status}): ${detail}`);
      }
      return response;
    }

    function report(error) { statusLine.textContent = error.message; }
    function batchPath() { return `/batches/${encodeURIComponent($("batch").value)}`; }
    function clock(seconds) {
      return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;
    }

    // An <img> tag cannot send the Authorization header, so a still is fetched and shown from a
    // blob URL. The least recently used ones are dropped, and their URLs revoked.
    function still(name) {
      let url = stills.get(name);
      if (url) {
        stills.delete(name);
      } else {
        url = api(`${batchPath()}/keyframes/${encodeURIComponent(name)}`)
          .then((response) => response.blob()).then((blob) => URL.createObjectURL(blob));
        url.catch(() => { if (stills.get(name) === url) stills.delete(name); });
      }
      stills.set(name, url);
      if (stills.size > MAX_STILLS) drop(stills.keys().next().value);
      return url;
    }

    function drop(name) {
      stills.get(name).then((url) => URL.revokeObjectURL(url), () => {});
      stills.delete(name);
    }

    async function loadBatches() {
      batches = await (await api("/batches")).json();
      $("batch").replaceChildren(...batches.map((b) => new Option(
        `${b.batch} · ${new Date(b.created).toLocaleString()} · ${b.memories} memories`, b.batch)));
      if (batches.length) await loadBatch();
      else statusLine.textContent = "No batches stored yet.";
    }

    async function loadBatch() {
      const name = $("batch").value;
      for (const key of [...stills.keys()]) drop(key); // keyframe names repeat between batches
      points = [];
      chosen = null;
      retrieved = new Set();
      $("summary").textContent = batches.find((b) => b.batch === name).summary;
      $("answer").textContent = $("caption").textContent = "";
      $("retrieved").replaceChildren();
      $("still").removeAttribute("src");
      draw();
      statusLine.textContent = "Loading the map…";
      const map = await (await api(`${batchPath()}/map`)).json();
      if ($("batch").value !== name) return; // another batch was chosen meanwhile
      points = map;
      draw();
      statusLine.textContent = `${points.length} memories.`;
    }

    function extent(key) {
      const values = points.map((p) => p[key]);
      return [Math.min(...values), Math.max(...values)];
    }
    function unit(value, low, high) { return high > low ? (value - low) / (high - low) : 0.5; }
    function color(u) {
      const at = u * (RAMP.length - 1), i = Math.min(Math.floor(at), RAMP.length - 2);
      return `rgb(${RAMP[i].map((c, k) => Math.round(c + (at - i) * (RAMP[i + 1][k] - c)))})`;
    }

    function dot(context, point, radius, ring, line) {
      context.beginPath();
      context.arc(point.px, point.py, radius, 0, 2 * Math.PI);
      context.fillStyle = point.color;
      context.fill();
      context.lineWidth = line;
      context.strokeStyle = ring;
      context.stroke();
    }

    // The map stretched to the canvas. Retrieved memories are larger with an orange ring; the
    // chosen one has a white ring.
    function draw() {
      const scale = window.devicePixelRatio || 1, width = canvas.clientWidth, height = canvas.clientHeight;
      canvas.width = width * scale;
      canvas.height = height * scale;
      const context = canvas.getContext("2d");
      context.scale(scale, scale);
      const [x0, x1] = extent("x"), [y0, y1] = extent("y"), [t0, t1] = extent("t_s");
      const pad = 3 * RADIUS;
      for (const p of points) {
        p.px = pad + unit(p.x, x0, x1) * (width - 2 * pad);
        p.py = height - pad - unit(p.y, y0, y1) * (height - 2 * pad);
        p.color = color(unit(p.t_s, t0, t1));
        dot(context, p, RADIUS, SURFACE, 1.5);
      }
      for (const p of points) if (retrieved.has(p.keyframe)) dot(context, p, RADIUS + 3, "#d95926", 3);
      if (chosen) dot(context, chosen, RADIUS + 4, "#fff", 3);
      $("start").textContent = points.length ? clock(t0) : "";
      $("end").textContent = points.length ? clock(t1) : "";
    }

    function nearest(event) {
      const box = canvas.getBoundingClientRect();
      const x = event.clientX - box.left, y = event.clientY - box.top;
      let best = null, bestDistance = REACH;
      for (const p of points) {
        const distance = Math.hypot(p.px - x, p.py - y);
        if (distance < bestDistance) { best = p; bestDistance = distance; }
      }
      return best;
    }

    async function choose(point) {
      if (!point || point === chosen) return;
      chosen = point;
      draw();
      $("caption").textContent = `Seen at ${clock(point.t_s)} · ${point.keyframe}`;
      try {
        const url = await still(point.keyframe);
        if (chosen === point) $("still").src = url; // unless the pointer has moved on
      } catch (error) {
        report(error);
      }
    }

    function showRetrieved(keyframes) {
      retrieved = new Set(keyframes);
      draw();
      $("retrieved").replaceChildren(...keyframes.map((keyframe) => {
        const image = new Image();
        image.alt = keyframe;
        image.onclick = () => choose(points.find((p) => p.keyframe === keyframe));
        still(keyframe).then((url) => { image.src = url; }, report);
        return image;
      }));
    }

    async function ask(event) {
      event.preventDefault();
      const name = $("batch").value;
      if (!name) return void (statusLine.textContent = "No batches stored yet.");
      $("send").disabled = true;
      statusLine.textContent = "Asking Gemma…";
      try {
        const response = await api(`${batchPath()}/ask`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question: $("question").value }),
        });
        const { answer, keyframes } = await response.json();
        if ($("batch").value !== name) return; // another batch was chosen meanwhile
        $("answer").textContent = answer;
        statusLine.textContent = `Answered from ${keyframes.length} memories, ringed on the map.`;
        showRetrieved(keyframes);
      } catch (error) {
        report(error);
      } finally {
        $("send").disabled = false;
      }
    }

    // A mouse chooses the point under it; a finger the point tapped or dragged over.
    for (const type of ["pointerdown", "pointermove"]) {
      canvas.addEventListener(type, (event) => choose(nearest(event)));
    }
    $("batch").addEventListener("change", () => loadBatch().catch(report));
    $("ask").addEventListener("submit", ask);
    addEventListener("hashchange", () => location.reload()); // a new link opened in this tab
    new ResizeObserver(draw).observe(canvas); // also the first draw
    $("ramp").style.background = `linear-gradient(to right, ${RAMP.map((c) => `rgb(${c})`).join(", ")})`;
    loadBatches().catch(report);
  </script>
</body>
</html>
