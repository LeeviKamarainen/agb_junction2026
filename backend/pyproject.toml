[project]
name = "junction2026-backend"
version = "0.1.0"
description = "Junction 2026 backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "pydantic-settings>=2.16.2",
    "sqlite-vec>=0.1.9",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
